<div *ngIf="isLoading" class="loading-overlay">
  <div class="spinner"></div>
</div>

<div class="dormitory-container">
  <!-- Cột trái: Quy định -->
  <div class="rules-section">
    <h2>📜 Quy định Ký túc xá</h2>
    <ul class="rules-list">
      <li>🧼 Giữ vệ sinh sạch sẽ.</li>
      <li>🔒 Bảo vệ an ninh, không gây rối.</li>
      <li>🤝 Ứng xử lịch sự với mọi người.</li>
    </ul>
    <div class="hours">
      <h4>🕐 Giờ giấc</h4>
      <p>⏰ Mở cửa: 6:00 AM - 10:00 PM</p>
      <p>🔕 Giới nghiêm: 11:00 PM</p>
    </div>
  </div>

  <!-- Cột phải: Bảng tin Admin -->
  <div class="posts-section">
    <h2>📢 Tin mới từ Ban quản lý</h2>

    <div *ngIf="adminPosts.length === 0">
      <p>Chưa có bài viết nào!</p>
    </div>
    <div *ngFor="let post of adminPosts" class="post-card">
      <div class="post-header">
        <img src="assets\image\admin-avatar.jpg" alt="admin" class="avatar" />
        <div>
          <h4 class="post-title">{{ post.Title }}</h4>
          <span class="post-time">📅 {{ post.PostDate | date: 'short' }}</span>
        </div>
      </div>
      <div class="post-body" [innerHTML]="post.Content"></div>
    </div>
  </div>
</div>
