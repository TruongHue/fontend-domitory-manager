<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <h2>Staff Dashboard</h2>
            <ul>
                <li class="active"><i class="fas fa-users"></i>Quản lý điện</li>
                <li><i class="fas fa-id-badge"></i>Quản lý nước</li>
                <li><i class="fas fa-file-invoice"></i>Hỗ trợ</li>
                <li><i class="fas fa-door-open"></i>Trang cá nhân</li>
            </ul>
            <div class="logout">
                <button class="logout-btn"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
            </div>
        </nav>
        <main class="content">
            <h1>Trang staff</h1>
            <p>Đây là nội dung của trang.</p>
        </main>
    </div>
</body>
</html>
