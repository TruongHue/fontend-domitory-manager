<div class="register-container">
    <div class="register-box">
        <h2>Đăng Ký</h2>
        
        <!-- Hiển thị lỗi nếu có -->
        <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
  
        <form #registerForm="ngForm" (submit)="onRegister()">
            <div class="form-group">
              <input type="text" placeholder="Họ và tên" [(ngModel)]="registerData.Account.UserName" name="userName" required>
              <input type="text" placeholder="Mã sinh viên" [(ngModel)]="registerData.Account.UserCode" name="userCode" required>
            </div>
            <div class="form-group">
                <input type="text" placeholder="Số điện thoại" [(ngModel)]="registerData.Account.NumberPhone" name="phone" required>
                <input type="email" placeholder="Email" [(ngModel)]="registerData.InfoStudent.Email" name="email" required>
            </div>
            <input type="password" placeholder="Mật khẩu" [(ngModel)]="registerData.Account.Password" name="password" required>
            <input type="password" placeholder="Nhập lại mật khẩu" [(ngModel)]="confirmPassword" name="confirmPassword" required>
  
            <select [(ngModel)]="registerData.InfoStudent.Gender" name="gender">
                <option value="0">Nam</option>
                <option value="1">Nữ</option>
            </select>
  
            <input type="text" placeholder="Địa chỉ" [(ngModel)]="registerData.InfoStudent.Address" name="address" required>
  
            <div class="form-group">
                <input type="text" placeholder="Tên phụ huynh" [(ngModel)]="registerData.InfoStudent.NameParent" name="nameParent" required>
                <input type="text" placeholder="SĐT phụ huynh" [(ngModel)]="registerData.InfoStudent.ParentNumberPhone" name="parentPhone" required>
            </div>
  
            <!-- Upload ảnh -->
            <input type="file" name="picture" (change)="onFileSelected($event)">
            <img *ngIf="previewImage" [src]="previewImage" alt="Ảnh xem trước" class="preview-img">
  
            <div class="checkbox-group">
                <input type="checkbox" id="agree" [(ngModel)]="agreed" name="agree">
                <label for="agree">Tôi cam kết rằng các thông tin trên là đúng</label>
            </div>
  
            <button type="submit" [disabled]="!agreed">Đăng Ký</button>
        </form>
  
        <!-- Hiển thị ảnh sau khi đăng ký -->
        <div *ngIf="uploadedImageUrl">
            <h3>Ảnh đã tải lên:</h3>
            <img [src]="uploadedImageUrl" alt="Ảnh sau khi đăng ký" class="uploaded-img">
        </div>
  
        <a routerLink="/login">Đã có tài khoản? Đăng nhập ngay</a>
    </div>
  </div>
